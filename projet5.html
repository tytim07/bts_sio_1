<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formule</title>
</head>
<body bgcolor="pink">

	<form action="#" method="post">
		
		<h1>Formule</h1>
			<table width="70%" border="0">
				<tr>
					<td><label for="nom">NOM :</label></td>
					<td><input type="text" id="nom" name="nom"></td>
				</tr>
				<tr>
					<td><label for="prenom">Prénom :</label></td>
					<td><input type="text" id="prenom" name="prenom"></td>
				</tr>
				<tr>
					<td><label for="date de naissance">Date de naissance :</label></td>
					<td><input type="date" id="date_naissance" name="date_naissance"></td>
				</tr>
				<tr>
					<td><label for="email">Adresse mail :</label></td>
					<td><input type="email" id="email" name="email"></td>
				</tr>
				<tr>
					<td><label for="mdp">Mot de passe :</label></td>
					<td><input type="password" id="mdp" name="mdp"></td>
				</tr>
				<tr>
					<td><label for="permis">Numéro de permis :</label></td>
					<td><input type="text" id="permis" name="permis"></td>
				</tr>
				<tr>
					<td><label for="anciennete">Nombre d'années d'ancienneté :</label></td>
					<td><input type="number" id="anciennete" name="anciennete" min="0" max="80"></td>
				</tr>
				<tr>
					<td><label for="ville">Ville :</label></td>
					<td><select id="ville" name="ville">
						<option value="paris">Paris</option>
						<option value="versailles">Versailles</option>
						<option value="creteil">Créteil</option>
						</select>
					</td>
				</tr>
				<tr><td><label for="adresse">Adresse du client :</label></td>
					<td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>
					</td>
				</tr>
			</table>
			<p>Situation matrimoniale :</p>
			<label for="marie_oui">Marié</label>
			<input type="radio" id="marie_oui" name="marie" value="oui">
			<label for="marie_non">Non marié</label>
			<input type="radio" id="marie_non" name="marie" value="non">
			<br>
			<br>

			<p>Préfecture de voiture :</p>
			<label for="pref_auto">Automatique</label>
			<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
			<label for="pref_manuelle">Manuelle</label>
			<input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle">

			<button type="submit">Enrégistrer</button>
			<button type="reset">Annuler</button>
	</form>

	<head>
		<h1>Inscription d'un Nouveau client</h1>
	</head>

	<section>
		<form action="#" method="post">
			...(tous les champs du formulaire, indentés d'un niveau supllémentaire)
		</form>
	</section>

	<footer>
		<p>&copy; 2026 Agence Méditerranée - Location du véhicules</p>
	</footer>

	<a href="index.html"> Aller vers la page Acceiul </a>
</body>
</html>
