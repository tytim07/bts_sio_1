<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Projet7</title>
</head>
<body bgcolor="pink">

	<form action="#" method="post">
		
		<h1>Ajout d'un nouveau véhicule</h1>
			<table width="70%" border="0">
				<tr>
					<td><label for="marque">Marque :</label></td>
					<td><select id="marque" name="marque">
						<option value="peugeot">Peugeot</option>
						<option value="mercedes">Mercedes</option>
						<option value="renault">Renault</option>
						</select>
					</td>
				</tr>
				<tr>
					<td><label for="immatriculation">Immatriculation :</label></td>
					<td><input type="text" id="immatriculation" name="immatriculation"></td>
				</tr>
				<tr>
					<td><label for="couleur">Couleur :</label></td>
					<td><input type="text" id="couleur" name="couleur"></td>
				</tr>
				<tr>
					<td><label for="date d'immatriculation">Date d'immatriculation :</label></td>
					<td><input type="date" id="date_immatriculation" name="date_immatriculation"></td>
				</tr>
				<tr>
					<td><label for="kilometrage">Kilométrage :</label></td>
					<td><input type="number" id="kilometrage" name="kilometrage"></td>
				</tr>
				<tr>
					<td><p>État :</p></td>
					<td><label for="occasion">Occasion</label>
						<input type="radio" id="occasion" name="occasion" value="occasion">
						<label for="neuf">Neuf</label>
						<input type="radio" id="neuf" name="neuf" value="neuf"></td>
				</tr>
				<tr>
					<td><p>Carburant :</p></td>
					<td><label for="hybride">Hybride</label>
						<input type="radio" id="hybride" name="hybride" value="hybride">
						<label for="electrique">Électrique</label>
						<input type="radio" id="electrique" name="electrique" value="electrique">
						<label for="diesel">Diesel</label>
						<input type="radio" id="diesel" name="diesel" value="diesel">
						<label for="essence">Essence</label>
						<input type="radio" id="essence" name="essence" value="essence">
					</td>
				</tr>
				<tr>
					<td><p>Boîte de vitesses :</p></td>
					<td><label for="manuelle">Manuelle</label>
						<input type="radio" id="manuelle" name="manuelle" value="manuelle">
						<label for="automatique">Automatique</label>
						<input type="radio" id="automatique" name="automatique" value="automatique">
					</td>
				</tr>
				<tr>
					<td><label for="portes">Nombre de portes :</label></td>
					<td><input type="number" id="portes" name="portes"></td>
				</tr>
				<tr>
					<td><label for="serie">Numéro de serie :</label></td>
					<td><input type="text" id="serie" name="serie"></td>
				</tr>
				<tr>
					<td><p>GPS :</p></td>
					<td><label for="gps_oui">Oui</label>
						<input type="radio" id="gps_oui" name="gps_oui" value="gps_oui">
						<label for="gps_non">Non</label>
						<input type="radio" id="gps_non" name="gps_non" value="gps_non">
					</td>
				</tr>
				<tr>
					<td><p>La climatisation :</p></td>
					<td><label for="clim_oui">Oui</label>
						<input type="radio" id="clim_oui" name="clim_oui" value="clim_oui">
						<label for="clim_non">Non</label>
						<input type="radio" id="clim_non" name="clim_non" value="clim_non">
					</td>
				</tr>
				
			</table>

	<button type="submit">Enrégistrer</button>
	<button type="reset">Annuler</button>
	<br>
	<a href="index.html">Retour</a> <br>
	<footer>
		<p>&copy; 2026 Agence Méditerranée - Location de véhicules</p>
	</footer>

</body>
</html>
